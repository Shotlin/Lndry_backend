worker_processes auto;
# Each Socket.IO client holds 2 connections (client<->nginx, nginx<->api); 1024/worker capped live sockets at ~1000 on 2 vCPU.
worker_rlimit_nofile 16384;

events {
    worker_connections 8192;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    server_tokens off;

    # The client address used for rate limiting and forwarded to the API.
    # This origin is reached DIRECTLY (not through Cloudflare), so CF-Connecting-IP
    # is just a header any caller can set — trusting it let anyone fake their IP and
    # dodge every IP-based limit. Use the real TCP peer address instead.
    # If you later put Cloudflare in front, switch to the realip module with
    # set_real_ip_from for Cloudflare's published ranges, then use CF-Connecting-IP.
    map $remote_addr $client_ip {
        default $remote_addr;
    }

    gzip on;
    gzip_types text/plain application/json application/javascript text/css;
    gzip_min_length 1000;

    # Rate limiting (changed 2026-11-07 after load test; see load-testing/REPORT.md F1).
    #  - Authenticated requests are limited per ACCESS TOKEN, so users sharing a carrier/office IP no longer
    #    starve each other. Anonymous requests are limited per client IP.
    #  - A forged random Authorization header only escapes THIS limiter; the app's own per-IP limiter
    #    (RATE_LIMIT_GLOBAL_IP_MAX) still counts it, so keep that value in step (see deploy notes).
    #  - Rejections are 429 (was nginx's default 503, which mobile apps read as "server down").
    map $http_authorization $limit_key_ip  { ""  $client_ip; default ""; }
    map $http_authorization $limit_key_tok { ""  "";         default $http_authorization; }
    limit_req_zone $limit_key_ip  zone=api_ip:10m  rate=100r/s;
    limit_req_zone $limit_key_tok zone=api_tok:20m rate=30r/s;
    limit_req_status 429;
    limit_req_log_level warn;

    upstream backend {
        server api:3000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name api.lndry.in;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type "text/plain";
        }

        location /health {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $client_ip;
            proxy_set_header X-Forwarded-For $client_ip;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name api.lndry.in;

        ssl_certificate     /etc/letsencrypt/live/api.lndry.in/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.lndry.in/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;

        # The app (Helmet) sends the same headers, so browsers received "nosniff, nosniff" and two HSTS
        # values. nginx is the single source for these; the upstream copies are dropped.
        # X-XSS-Protection is deprecated (can create XSS in old browsers) - Helmet's "0" passes through.
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header Referrer-Policy;

        client_max_body_size 10M;

        location /health {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $client_ip;
            proxy_set_header X-Forwarded-For $client_ip;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header CF-Connecting-IP $client_ip;
            proxy_set_header Connection "";
        }

        location /socket.io/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $client_ip;
            proxy_set_header X-Forwarded-For $client_ip;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header CF-Connecting-IP $client_ip;
            proxy_read_timeout 86400;
        }

        location /api/webhook/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $client_ip;
            proxy_set_header X-Forwarded-For $client_ip;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header CF-Connecting-IP $client_ip;
        }

        location /api/v1/admin/app-releases {
            # APK uploads (70-120MB) — the global client_max_body_size 10M
            # above would reject them before the request even reaches
            # Fastify. Scoped to this one admin-only, authenticated upload
            # path; every other /api/ route keeps the 10M ceiling.
            client_max_body_size 250M;
            proxy_request_buffering off;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $client_ip;
            proxy_set_header X-Forwarded-For $client_ip;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header CF-Connecting-IP $client_ip;
            proxy_set_header Connection "";
        }

        location /api/ {
            limit_req zone=api_ip  burst=200 nodelay;
            limit_req zone=api_tok burst=60  nodelay;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $client_ip;
            proxy_set_header X-Forwarded-For $client_ip;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header CF-Connecting-IP $client_ip;
            proxy_set_header Connection "";
        }

        location = / {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $client_ip;
            proxy_set_header X-Forwarded-For $client_ip;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header CF-Connecting-IP $client_ip;
            proxy_set_header Connection "";
        }

        location / {
            return 404 '{"success":false,"message":"Not found","code":"NOT_FOUND"}';
            add_header Content-Type application/json;
        }
    }
}
